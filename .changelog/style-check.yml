name: Style Check

on:
  pull_request:
  push:
    branches:
      - hikari

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Check formatting
        run: mvn -B spotless:check