# ==========================================================
# QuickShop-Hikari Main Configuration
# ==========================================================
#
# Website: https://quickshophikari.org/
# Documentation: https://quickshop-community.github.io/QuickShop-Hikari-Documents/
# Community Discord: https://discord.com/invite/Bu3dVtmsD3
#
# This file controls the core behavior of QuickShop-Hikari.
# Read the comments carefully—especially for advanced options.

# Internal configuration version.
# Do not change this unless QuickShop support instructs you to.
config-version: 1047

# Default language used by the plugin.
# Set to "default" to use the player's Minecraft client language automatically.
# Example language code: en_us
game-language: default

# Enable specific languages for players.
# If a player uses a disabled language, the plugin will fall back to "game-language".
#
# Use:
#   - '*' to enable all available languages.
#
# Language files can update automatically via Crowdin OTA:
#   https://crowdin.com/project/qs-hikari
#
# For custom translations, use the language override system:
#   https://quickshop-community.github.io/QuickShop-Hikari-Documents/docs/modules/localization
enabled-languages:
  - '*'

# Language Processing Options
# These settings control how translations and placeholders are processed.
lang-processor:
  # [BETA] Post-process filler replacements.
  replace-filler-post-process: false
  # Enable PlaceholderAPI post-processing for translated messages.
  papi-post-process: true
  # Prevent item names from always appearing italicized.
  fix-item-always-italic: true

# Download source for Mojang translation resources
# (item names, potion effects, etc.)
#
# 0 = Official Mojang server (recommended)
# 1 = BMCLAPI (Unofficial China mirror)
#
# Change only if you have download/connectivity issues.
mojangapi-mirror: 0

# Crowdin OTA host URL.
# You may host your own OTA server if needed.
crowdin-host: "https://crowdinota.hikari.r2.quickshop-powered.top"

# Use Crowdin OTA to automatically update language files.
use-crowdin-ota: true

# Developer mode.
# Advanced feature—only enable if you know why you need it.
dev-mode: false

# Shop Tax Configuration
# Controls how transaction taxes are calculated and applied.
shop-tax:

  # Select which tax system to use:
  # basic       = Flat tax rate
  # progressive = Tax rate based on player balance brackets
  type: basic

  # Account name that receives collected tax money.
  # Set to "" to disable depositing (tax may still be deducted).
  account: tax

  # Show tax details in transaction messages.
  show: false

  # Disable taxes for unlimited shops.
  disable-for-unlimited-shop: false


  # Who to apply the tax to, be it the shop or the player interacting with the shop.
  # The person that the tax is applied to will have the permission check ran on them to see if they
  # should be taxed be it the player or the shop owner or both.
  # player = Apply tax to the player who is interacting with the shop.
  # shop = Apply tax to the shop owner.
  # payee = Apply tax to the person receiving the money.
  # both = Apply tax to both the player and the shop owner.
  apply-to: player

  # -----------------------------
  # Basic Tax System
  # -----------------------------
  basic:

    # Flat tax rate (decimal format).
    # Example: 0.05 = 5%
    rate: 0.05

  # ==========================================================
  # Progressive Tax System
  # ==========================================================
  #
  # Applies different tax rates based on a player's balance.
  # Higher balances can have higher tax rates.
  #
  # Bracket format:
  #   <upper-balance>: <tax-rate>
  #
  # Rules:
  # - If a player's balance is LESS THAN OR EQUAL TO the upper-balance,
  #   that tax rate is used.
  #
  # - Tax rates are decimals:
  #     0.01 = 1%
  #     0.05 = 5%
  #     0.10 = 10%
  #
  # Special value:
  # - Use -1 as the upper-balance to represent "no upper limit".
  #
  # Example:
  #   10000: 0.01
  #   → Players with ≤ 10,000 balance are taxed 1%.
  progressive:

    # -----------------------------
    # Tax Brackets
    # -----------------------------
    # For readability, keep brackets ordered from low to high.
    # (Ordering is enforced internally.)
    brackets:
      # New / low-balance players
      # ≤ 10,000 → 1%
      10000: 0.01
      # Early progression
      # ≤ 50,000 → 2%
      50000: 0.02
      # Mid-game economy
      # ≤ 250,000 → 3%
      250000: 0.03
      # Wealthy players
      # ≤ 1,000,000 → 5%
      1000000: 0.05
      # Very wealthy players
      # ≤ 5,000,000 → 8%
      5000000: 0.08
      # Ultra-wealthy / no upper limit
      # > 5,000,000 → 12%
      -1: 0.12

# Configurations relating to the shop tags functionality
shop-tag:

  # Should the shop tags functionality be enabled?
  enabled: true

  # Should the avoid system tag be enabled?
  avoid-enabled: true

  # Should the favorite system tag be enabled?
  favorite-enabled: true

  # Should the watch system tag be enabled?
  watch-enabled: true

# When enabled, switching a shop to "unlimited" will migrate its owner
# to a specified account.
#
# Note:
# - This does not affect existing unlimited shops automatically.
# - You must toggle the shop to unlimited again to apply the change.>>>>>>> hikari
unlimited-shop-owner-change: false

# Target account used by unlimited-shop-owner-change.
# Only applies when unlimited-shop-owner-change is true.
unlimited-shop-owner-change-account: quickshop

# Respect item flags (for example, HIDE_ENCHANTS to hide enchantments in tooltips).
respect-item-flag: true

# Send cross-server messages to the player (proxy/network feature).
# May cause disconnects on some networks with mixed Minecraft versions.
bungee-cross-server-msg: false

# Proxy / Network Settings
proxy:
  # Force BungeeCord mode.
  force-bungeecord: false

# Currency used when creating shops.
# Set to "" to use the default currency.
# Only required for multi-currency setups.
currency: ""

# Logging
logging:
  # Enable file/database logging.
  # Main log file: plugins/QuickShop-Hikari/qs.log
  enable: true
  # Log shop transactions and creations.
  log-actions: true
  # Log balances before and after trades.
  log-balance: true
  # Log file split size (MB). Older logs move to plugins/QuickShop-Hikari/logs
  file-size: 10.0
  # Storage location:
  # 0 = file
  # 1 = database
  location: 1

# Force Bukkit chat handler.
# Related issue: https://github.com/KaiKikuchi/QuickShop/issues/10
force-bukkit-chat-handler: false

# Allow QuickShop to check for updates.
updater: true

# Source used for update checks.
# Allowed values: "nexus", "modrinth"
# - nexus: snapshots + releases
# - modrinth: releases only
updater-source: "modrinth"

# Automatically report errors to the author (when privacy settings allow).
auto-report-errors: true

# Tab completion source:
# false = Only online players (faster)
# true  = All known offline players (may lag on large servers)
include-offlineplayer-list: false

# Economy provider selection.
# 0 = Vault/VaultUnlocked
# VaultUnlocked supports multi-currency if your economy plugin supports it.
#
# Advanced option—ask for support before changing if unsure.
economy-type: 0

# Format money values using a decimal pattern.
use-decimal-format: false

# Decimal format pattern.
# Default: #,###.##
decimal-format: "#,###.##"

# Send alerts if someone tries to exploit display item behavior.
send-display-item-protection-alert: false

# Send alerts if someone tries to steal from a shop.
send-shop-protection-alert: false

# Database Configuration
# QuickShop supports:
# - H2 (local file database; simplest setup)
# - MySQL (recommended for large servers or networks)
database:
  # false = Use local H2 database
  # true  = Use MySQL database
  mysql: false
  # Database host (only required when mysql is true)
  host: localhost
  # Database port (only required when mysql is true)
  port: 3306
  # Database name (only required when mysql is true)
  database: quickshop
  # Database username (only required when mysql is true)
  user: root
  # Database password (only required when mysql is true)
  password: passwd
  # Table prefix. Set to "none" to remove prefix.
  # Each server must use a unique table prefix. Multiple servers cannot share the same table prefix.
  prefix: "qs_"
  # Use SSL for database connections (only required when mysql is true)
  usessl: false
  # Disable username caching in the database.
  disable-username-cache: false
  # Enable UUID caching/baking for faster lookups (advanced).
  bake-uuids: false
  # Loader service thread count:
  # -1 = Automatically choose a recommended value.
  # Advanced option—change only if you understand thread tuning.
  loader-threads: -1
  # Include full database info in /qs paste output.
  generate-full-report: false
  # Disable shutdown timeout while saving.
  # May cause the server to hang during shutdown.
  unlimited-save-wait: false
  # Skip database/table version checks.
  # Disabling is risky; support may not be provided.
  skip-version-check: false
  # Connection pool properties (HikariCP).
  # Advanced: tune for large servers if you know what you're doing.
  properties:
    connectionTimeout: 60000
    idleTimeout: 10000
    maxLifetime: 1800000
    maximumPoolSize: 10
    minimumIdle: 10
    cachePrepStmts: true
    prepStmtCacheSize: 250
    prepStmtCacheSqlLimit: 2048
    useUnicode: true
    characterEncoding: utf8
    allowPublicKeyRetrieval: true
    keepaliveTime: 60000

# Shop Limits
# Limits how many shops a player can own.
limits:
  # Enable shop limits.
  # Leave false if you are not using this feature.
  use: false

  # Default shop limit for players.
  default: 10

  # Use legacy calculation for unlimited shops in limit totals.
  old-algorithm: false

  # Bind shop limits to permissions.
  # Add as many as you want using:
  # <permission-node>: <shop-limit>
  ranks:
    # Example: players with quickshop.example permission can create 20 shops.
    quickshop.example: 20

# Shop Blocks
# Blocks allowed for shop containers.
# Must implement InventoryHolder (not normal blocks like dirt/stone).
#
# Some blocks may behave unexpectedly:
# - Hoppers can pull display items
# - Furnaces allow interactions with multiple slots
# - Dispensers may not be protected from redstone
shop-blocks:
  - CHEST
  - TRAPPED_CHEST
  - BARREL

shop:

  # Validate that a shop is still a valid shop block during lookups.
  # May cause extra chunk loads and checks (performance impact).
  shoppable-check: true

  # Update a shop's sign when the shop is loaded.
  # Can increase load-time work (performance impact).
  update-sign-on-load: false

  # Skip confirmation prompts for destructive commands (like remove).
  skip-command-confirmation: false

  # Disable showing unlimited shops in /qs browse menu.
  disable-unlimited-browse: false

  # Control panel components used when not using the GUI-based control panel.
  control-panel:
    - owner
    - unlimited
    - freeze
    - shop_mode
    - set_price
    - set_amount
    - refill
    - empty
    - display
    - history
    - remove

  # Shop Sign Layout
  # Item level = level for enchantment or duration for potions.
  layout:

    # Layout for BUYING shops.
    BUYING:
      line1: "header"
      line2: "trading"
      line3: "item"
      line4: "price"

    # Layout for FROZEN shops.
    FROZEN:
      line1: "header"
      line2: "trading"
      line3: "item"
      line4: "price"

    # Layout for SELLING shops.
    SELLING:
      line1: "header"
      line2: "trading"
      line3: "item"
      line4: "price"

  # Cost to create a shop.
  # Set to 0 to disable the creation fee.
  cost: 0

  # Refund the player when their shops are deleted/removed/broken.
  refund: false

  # Refund from the tax account when refunding.
  # Refund is "best effort": if the tax account lacks funds, the player may not receive the full amount.
  refund-from-tax-account: false

  # Send stock-related messages to shop staff.
  sending-stock-message-to-staffs: false

  # Disable shop trading while in creative mode.
  disable-creative-mode-trading: false

  # Disable the Super Tool (golden axe used by creative players to break shops).
  disable-super-tool: false

  # Disable the ability to transfer buy shops using the transfer and transferall commands.
  disable-buy-transfer: false

  # Allow shop owners to break only the sign (so it can be replaced).
  # WARNING: May cause sign duplication if auto-sign is enabled.
  allow-owner-break-shop-sign: false

  # Charge a fee when changing shop prices (helps reduce constant undercutting).
  price-change-requires-fee: true

  # Price change fee amount.
  fee-for-price-change: 50

  # Lock shop containers from non-owners (prevents theft).
  lock: true

  # Disable "quick create" (click chest with item to create shop quickly).
  disable-quick-create: false

  # Automatically create the sign when a shop is created.
  auto-sign: true

  # Enable glowing text on shop signs.
  sign-glowing: false

  # Wax shop signs (prevents editing).
  sign-wax: false

  # Set sign dye color.
  # DyeColor list:
  # https://hub.spigotmc.org/javadocs/spigot/org/bukkit/DyeColor.html
  sign-dye-color: ""

  # Pay/take money to/from unlimited shop owners.
  pay-unlimited-shop-owners: false

  # Display items above shop containers.
  # WARNING: May cause item duplication in some environments.
  display-items: true

  # Default state for shop displays (enabled/disabled).
  display-default: true

  # How often (ticks) to validate display item position.
  # Set to 0 to disable.
  # Note: Does not apply to Virtual Display Items.
  display-items-check-ticks: 6000

  # Display type:
  # 2 = Virtual Item (recommended; reduces entities)
  # Requires ProtocolLib or PacketEvents (feature disables if missing).
  # 3 = Display Entity (non-packet-based; shouldn't cause lag, but never know without more data 1.19.4+)
  display-type: 2

  # Preferred protocol implementation for virtual displays:
  # - protocollib
  # - packetevents
  display-protocol: 'protocollib'

  # Automatically despawn display items when no players are nearby.
  display-auto-despawn: false

  # Range (blocks) at which displays despawn when no players are nearby.
  display-despawn-range: 20

  # Interval (ticks) used to check whether displays should spawn/despawn.
  # Note: Does not apply to Virtual Display Items.
  display-check-time: 40

  # Allow display items to show stacked visual effects (when stack creation is enabled).
  # Note: Does not apply to Virtual Display Items.
  display-allow-stacks: false

  # Allow display items to show enchantment glint/enchantments visually.
  display-allow-enchants: true

  # Display offset relative to the shop container location.
  display-coords:
    # X offset from the shop container location.
    # Controls left/right position relative to the block.
    # Positive values move east, negative values move west.
    # Supports decimal values (example: 0.5 centers on the block).
    x: 0.5

    # Y offset from the shop container location.
    # Controls vertical height of the display.
    # Positive values move upward, negative values move downward.
    # Supports decimal values.
    y: 0.8

    # Z offset from the shop container location.
    # Controls forward/backward position relative to the block.
    # Positive values move south, negative values move north.
    # Supports decimal values.
    z: 0.5

  # Display rotation settings. This is only used for display-type 3.
  display-rotation:

    # Rotation angle in degrees.
    degrees: 0.0

    # X-component of the rotation axis.
    x: 0.0

    # Y-component of the rotation axis.
    y: 1.0

    # Z-component of the rotation axis.
    z: 0.0

  # The scale of the display item. This is only used for display-type 3.
  display-scale:

    x: 1.25
    y: 1.25
    z: 1.25

  # This spawns a separate fake entity that displays shop information.
  text-display:

    # Should the text display be enabled?
    enabled: false

    # Text Display view range
    range-blocks: 3

    # Height above the item
    y-offset: 0.8

    # Background color (32-bit ARGB)
    background-color: 1073741824

    # The line width of the text display.
    line-width: 200

    # Text opacity for the display. -1 is full opaque, values accepted are 0-255.
    # Note: values 0 - 25 are considered invisible by the rendering engine.
    text-opacity: -1

    # Should the text display text be see through?
    see-through: false

    # Text shadow configurations
    shadow:

      # Should text shadows be enabled?
      enabled: true

    # The scale of the text display.
    # The acceptable values are from 0.0 to 1.0.
    scale:

      x: 0.5
      y: 0.5
      z: 0.5

    # <item_name> is replaced with the item name.
    # <price_alone> is replaced with the item price.
    # <amount> is replaced with the item amount.
    # <price_amount> is replaced with the item price per amount.
    # <owner> is replaced with the shop owner's name.
    # <type> is replaced with the shop type (BUYING/SELLING).
    # <status> is replaced with the shop status (ACTIVE/FROZEN).
    lines:
    - "<green><item_name></green>"
    - "<gray><owner></gray>"
    - "<gray><type></gray>"
    - "<gold><price_amount></gold>"

  # [BETA] Per-player shop sign translations (i18n).
  # Sends an extra sign packet so each player sees text in their own locale.
  per-player-shop-sign: false

  # /quickshop find Settings
  # Allows players to search for nearby shops by item name.
  finding:
    # Use legacy find behavior (closest shop focus).
    oldLogic: false
    # Search radius (blocks).
    distance: 45
    # Maximum number of shops shown in results.
    limit: 10
    # Ignore distance and search globally.
    global: false
    # Cooldown between searches (seconds).
    cooldown: 20
    # Include shops in unloaded chunks (may load chunks / higher cost).
    all: true
    # Exclude out-of-stock or full shops (may improve performance).
    exclude-out-of-stock: false

  # Fallback currency symbol if Vault/economy does not provide one.
  alternate-currency-symbol: '$'

  # Multi-currency symbol mapping:
  # Format: <currencyName>;<symbol>
  # If no match, the currency name itself is used.
  alternate-currency-symbol-list:
    - USD;$
    - CNY;￥

  # Force QuickShop to use the alternate currency symbol if Vault formatting is incorrect.
  disable-vault-format: false

  # Display currency symbol on the right side (example: 1234$).
  # Only works when disable-vault-format is true.
  currency-symbol-on-right: false

  # Hide trade messages for unlimited shops.
  ignore-unlimited-shop-messages: true

  # Automatically fetch and deliver shop history messages.
  # Disabling may cause database/message consistency issues.
  auto-fetch-shop-messages: true

  # Delay (ticks) before flushing pending messages when a player joins.
  join-flush-delay: 60

  # Ignore cancelled chat events (may improve compatibility with chat plugins).
  ignore-cancel-chat-event: false

  # Allow shop owners to grant benefits to offline players.
  allow-offline-benefit: false

  # Allow shops to be created even if there is no valid space for a sign.
  # Example: blocks around the container prevent sign placement.
  allow-shop-without-space-for-sign: false

  # Maximum number of digits allowed after the decimal point in prices.
  # Set to -1 to disable this limit.
  maximum-digits-in-price: -1

  # If someone with quickshop.setowner changes an admin shop owner,
  # show the owner's UUID in the control panel.
  show-owner-uuid-in-controlpanel-if-op: false

  # Wall sign material used for shop signs.
  sign-material: OAK_WALL_SIGN

  # Show one enchantment name on the sign for enchanted books (instead of "Enchanted Book").
  # NOTE: Only one enchantment is shown, chosen randomly.
  use-enchantment-for-enchanted-book: false

  # Whether or not to use roman numerals for enchantment number displays or not.
  use-roman-numeral-for-enchantments: true

  # Show one potion effect name on the sign (instead of "Potion").
  # NOTE: Only one effect is shown, chosen randomly.
  use-effect-for-potion-item: false

  # Show song name on the sign (instead of "Music Disc").
  use-song-for-disc-item: false

  # Worlds where shop creation is allowed.
  # If not empty, only worlds in this list can create shops.
  # Takes priority over blacklist-world.
  whitelist-world: []

  # Worlds where shop creation is disallowed.
  # Only checked when whitelist-world is empty.
  blacklist-world:
    - disabled_world_name

  # Lore keywords that prevent items from being sold.
  # Does not affect existing shops.
  blacklist-lores:
    - "SoulBound"

  # Protection Checking
  # Uses a simulated BlockBreakEvent to check whether a player can break blocks.
  # Some protection plugins may conflict with this approach.
  #
  # If you experience protection conflicts, disable this and rely on integrations below.
  protection-checking: true

  # Cancel the simulated event before MONITOR listeners.
  # Advanced behavior—helps avoid duplicate handling in some setups.
  cancel-protection-fake-event-before-reach-monitor-listeners: true

  # Ignore PlayerInteractEvents that were already cancelled.
  ignore-cancelled-interact-event: true

  # Worlds where protection checking is disabled.
  protection-checking-blacklist:
    - disabled_world

  # Skip specific listeners during protection-checking.
  #
  # Examples:
  # - xx.xxx.xxx.xxxxx.BlockBreakListenerClass
  #   → Skips only that exact class
  #
  # - xx.xx.xxx.xxxxx
  #   → Skips any listener class starting with that prefix
  #
  # - @PluginName
  #   → Skips listeners registered by that plugin
  #
  # - REGEX
  #   → Regex patterns are supported
  protection-checking-listener-blacklist:
    - ignored_listener

  # Maximum number of shops checked per batch during existence checks.
  max-shops-checks-in-once: 100

  # Apply custom name to spawned DisplayItem entities.
  display-item-use-name: false

  # Update shop signs when InventoryMoveItemEvent occurs (e.g., hoppers).
  # Disable if it impacts server performance.
  update-sign-when-inventory-moving: false

  # Allow economy "loan" behavior (requires supported economy plugin).
  allow-economy-loan: false

  # Keyword used to trade all matching items from a player's inventory.
  word-for-trade-all-items: "all"

  # Shop naming cost and limits.
  name-fee: 0
  name-max-length: 32

  # Ongoing Fee
  # Charges shop owners a recurring fee.
  # Shops are removed automatically if the owner cannot pay.
  ongoing-fee:
    enable: false
    # How often the fee is charged (ticks).
    ticks: 42000
    # Fee amount per shop.
    cost-per-shop: 2
    # Ignore unlimited shops.
    ignore-unlimited: true

  # Cross-Version Item Loading (Advanced / Risky)
  # Attempts to load items created on newer Minecraft versions.
  # WARNING: This may corrupt server or shop data. Always backup first.
  force-load-downgrade-items:
    enable: false
    # Work mode:
    # 0 = Ask Bukkit to update the ItemStack
    # 1 = Ask Bukkit to load the ItemStack directly
    method: 0

  # If a block/entity triggers the protection system, remove it.
  remove-protection-trigger: true

  # Allow trading multiple stacks in one transaction (bulk trades).
  allow-stacks: false

  # Ignore custom item display names when matching.
  force-use-item-original-name: false

  # [BETA] Allow /quickshop size to exceed vanilla stack limits by disabling checks.
  disable-max-size-check-for-size-command: false

  # Enable shop caching for improved lookup performance.
  use-cache: true

  # Info panel display toggles for item details.
  info-panel:
    show-effects: true
    show-enchantments: true
    show-durability: true
    # Minimum interval (in milliseconds) between repeated shop info-panel sends to the same
    # player for the SAME shop. Spam-clicking one shop skips re-sending the info panel,
    # while trading and the "how many to buy/sell" prompt still work normally.
    # Set to 0 to disable.
    click-cooldown: 100

# Item Blacklist
# Items that cannot be sold in shops.
# Permission quickshop.bypass.<itemID> bypasses the restriction.
#
# You can reference the item lookup table by using '@' before the name.
# For referenced items, permission quickshop.bypass.reference applies.
#
# Supports Item Expression:
# https://quickshop-community.github.io/QuickShop-Hikari-Documents/docs/modules/item-expression
blacklist:
  - Bedrock

# Worlds to explicitly allow/deny when loading shops from the database.
database-loading-whitelist-worlds: []

database-loading-blacklist-worlds:
  - "the world that shop won't to be loaded"

# Plugin Integrations
plugin:
  # If Multiverse-Core is present, QuickShop may attempt to load worlds that are missing.
  # This may throw exceptions and then attempt to repair shop data.
  Multiverse-Core: true

  # PlaceholderAPI integration settings.
  PlaceHolderAPI:
    enable: true
    # Placeholder cache lifetime (ms).
    # Smaller values may increase processing cost.
    cache: 900000

  # WorldEdit integration.
  # Helps delete shops in selected regions to prevent ghost shops.
  WorldEdit: true

# In-Game Effects
effect:
  sound:
    # Play sounds during tab completion.
    ontabcomplete: true
    # Play sounds when executing commands.
    oncommand: true
    # Play sounds when clicking shop container/sign.
    onclick: true

# Item Matcher
# Advanced option—controls how items are compared for shop matching.
matcher:

  # Matcher type:
  # 1 = Bukkit matcher
  # 2 = Strict Bukkit matcher (equals method)
  # 3 = Modern matcher
  work-type: 1

  # Ignore stack size when matching items.
  # Recommended for shop matching.
  ignore-count: true

  # Require material/type to match (strongly recommended).
  check-material: true

  # Compare ONLY enabled components below.
  #
  # DIRECT keys map 1:1 to DataComponentTypeKeys.<KEY>
  # GROUP keys expand into multiple underlying component keys
  components:

    # ------------------------------
    # DIRECT COMPONENT KEYS
    # ------------------------------

    # Compare durability/damage.
    DAMAGE: true

    # Compare anvil repair cost.
    REPAIR_COST: false

    # Compare custom display name.
    CUSTOM_NAME: true

    # Compare item name override.
    ITEM_NAME: false

    # Compare lore.
    LORE: true

    # Compare CustomModelData.
    CUSTOM_MODEL_DATA: true

    # Compare enchantments.
    ENCHANTMENTS: true

    # Compare stored enchantments (enchanted books).
