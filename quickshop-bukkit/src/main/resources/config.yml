# Shop Protection Toggles
protect:
  explode: true
  hopper: true
  hopper-owner-exclude: false
  dropper: true
  dropper-owner-exclude: false
  entity: true
  oxidation: true

# Backup Policy
# Controls when QuickShop creates automatic backups.
backup-policy:
  shops-auto-purge: false
  database-upgrade: true
  startup: false
  recovery: true

# Custom Item Stack Sizes
# Set custom max stack sizes for items.
#
# Examples:
# custom-item-stacksize:
#  - "*:128"
#  - STONE:128
custom-item-stacksize: [ ]

# Shop Purger
# Purges shops owned by players who have been offline for X days.
purge:
  enabled: false
  # Purge automatically on server startup.
  at-server-startup: true
  # Offline days required before a player is eligible for purge.
  days: 60
  # Compatibility note: currently supports vanilla banning system behavior.
  banned: true
  # Compatibility note: currently supports vanilla OP system behavior.
  skip-op: true

# Debug Settings
# Disabling debug logging improves performance but reduces support visibility.
debug:
  disable-debuglogger: false
  shop-deletion: false
  delete-corrupt-shops: false

# Legacy Data Updater
# Backward compatibility for older QuickShop versions.
# Enable ONLY if migrating from very old QuickShop versions.
legacy-updater:
  shop-sign: false

# Command aliases for /qs main command.
custom-commands:
  - qs
  - shop
  - chestshop
  - cshop

# Command aliases for /qs sub-commands.
custom-subcommands:
  help: help

# Internal flag used to detect damaged configs.
# Leave this false.
config-damaged: false

# Fixed translation overrides.
# Example:
#  - "ecoenchants:enchantment.damage_artifact=Artifact Damage"
custom-translation-key: [ ]

# UUID / Username Lookup
# Controls how QuickShop resolves UUID <-> username mappings.
uuid-lookup:

  # Use QuickShop database for UUID lookups.
  allow-db-uuid: true

  # Use QuickShop database for name lookups.
  allow-db-name: true

  # Use EssentialsX cache for name/UUID resolution.
  allow-essentialsx-uuid: true
  allow-essentialsx-name: true

  # Use PlayerDB cache (if present).
  allow-playerdb-uuid: false
  allow-playerdb-name: false

  # Use Bukkit offline player lookups.
  allow-bukkit-uuid: true
  allow-bukkit-name: true

# Privacy Controls
# Controls privacy-related features and reporting categories.
#
# Use `/quickshop paste` and review the "Privacy Logs" section to audit.
# To fully disable bStats, edit: /plugins/bStats/config.yml
privacy:
  type:
    # Diagnostics: /qs paste + error reporting systems
    DIAGNOSTIC: true
    # bStats metrics with prefix "Statistic - "
    STATISTIC: true
    # bStats metrics with prefix "Research - "
    RESEARCH: true
  module:
  #  SOME_MODULE_NAME_HERE: false

# Transaction Metrics
# Records transactions into the database for metrics/analytics.
# Disabling stops transaction metric recording.
transaction-metric:
  enable: true