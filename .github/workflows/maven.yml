name: Maven CI

on:
  push:
    branches:
      - hikari
      - cleanup
  pull_request:
    branches:
      - hikari
      - cleanup

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: mvn -B clean verify -T 1.5C -P github --file pom.xml -pl !com.ghostchu.quickshop.compatibility:itemsadder

      - name: Collect PR artifacts
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          rm -rf pr-artifacts
          mkdir -p pr-artifacts

          find quickshop-bukkit/target -type f -name "QuickShop-Hikari-*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -exec cp {} pr-artifacts/ \;

          find . -type f -path "*/target/Compat*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -exec cp {} pr-artifacts/ \;

          find . -type f -path "*/target/Addon*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -exec cp {} pr-artifacts/ \;

          ls -la pr-artifacts

      - name: Upload PR artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: quickshop-pr-${{ github.event.pull_request.number }}
          path: pr-artifacts/*.jar
          retention-days: 14

      - name: Find existing artifact comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v3
        id: find-artifact-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- quickshop-pr-artifacts -->"

      - name: Create or update artifact comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-artifact-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- quickshop-pr-artifacts -->
            Latest build artifacts are available for this PR.

            Commit: `${{ github.sha }}`
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Download the artifact named:

            `quickshop-pr-${{ github.event.pull_request.number }}`

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        if: success() && github.event_name != 'pull_request'
        with:
          name: quickshop-ci-artifacts
          path: |
            quickshop-bukkit/target/QuickShop-Hikari-*.jar
            **/target/Compat*.jar
            **/target/Addon*.jar