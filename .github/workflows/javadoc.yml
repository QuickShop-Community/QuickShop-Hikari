name: Deploy Javadocs

on:
  workflow_dispatch:
  push:
    branches:
      - hikari

permissions:
  contents: write

jobs:
  javadocs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Generate Javadocs
        run: |
          mvn -B clean package javadoc:javadoc \
            -P github \
            -DskipTests \
            -Dmaven.javadoc.failOnError=false \
            -Dmaven.javadoc.failOnWarnings=false \
            --file pom.xml

      - name: Collect Javadocs
        run: |
          rm -rf public
          mkdir -p public/javadoc

          find . -path "*/target/site/apidocs/index.html" -print

          for dir in $(find . -path "*/target/site/apidocs" -type d); do
            module=$(echo "$dir" | sed 's#^\./##' | cut -d/ -f1)
            mkdir -p "public/javadoc/$module"
            cp -R "$dir"/* "public/javadoc/$module/"
          done

          test -f public/javadoc/index.html || cat > public/javadoc/index.html <<'EOF'
          <!doctype html>
          <html>
          <head><meta charset="utf-8"><title>QuickShop-Hikari Javadocs</title></head>
          <body>
          <h1>QuickShop-Hikari Javadocs</h1>
          <ul>
          EOF

          for module in $(find public/javadoc -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort); do
            echo "<li><a href=\"${module}/index.html\">${module}</a></li>" >> public/javadoc/index.html
          done

          cat >> public/javadoc/index.html <<'EOF'
          </ul>
          </body>
          </html>
          EOF

          test -f public/javadoc/index.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public/javadoc
          destination_dir: javadoc
          keep_files: true