name: Deploy Javadocs

on:
  workflow_dispatch:
  push:
    branches:
      - hikari

permissions:
  contents: write

jobs:
  javadocs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Generate Javadocs
        run: |
          mvn -B clean install javadoc:javadoc \
            -DskipTests \
            -Dmaven.javadoc.failOnError=false \
            -Dmaven.javadoc.failOnWarnings=false \
            -pl quickshop-common,quickshop-api,platform/quickshop-platform-interface,platform/quickshop-platform-paper,quickshop-bukkit \
            -am \
            --file pom.xml

      - name: Collect Javadocs
        run: |
          rm -rf public
          mkdir -p public/javadoc

          modules=(
            "quickshop-api"
            "quickshop-common"
            "platform/quickshop-platform-interface"
            "platform/quickshop-platform-paper"
            "quickshop-bukkit"
          )

          for module in "${modules[@]}"; do
            dir="$module/target/site/apidocs"
            name=$(basename "$module")

            if [ -f "$dir/index.html" ]; then
              mkdir -p "public/javadoc/$name"
              cp -R "$dir"/* "public/javadoc/$name/"
            fi
          done

          cat > public/javadoc/index.html <<'EOF'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>QuickShop-Hikari Javadocs</title>
          </head>
          <body>
            <h1>QuickShop-Hikari Javadocs</h1>
            <ul>
          EOF

          for module in $(find public/javadoc -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort); do
            echo "      <li><a href=\"${module}/index.html\">${module}</a></li>" >> public/javadoc/index.html
          done

          cat >> public/javadoc/index.html <<'EOF'
            </ul>
          </body>
          </html>
          EOF

          find public -maxdepth 4 -type f | sort | head -100
          cat public/javadoc/index.html

          test "$(find public/javadoc -mindepth 1 -maxdepth 1 -type d | wc -l)" -gt 0

      - name: Debug Javadoc output
        run: |
          find public -maxdepth 4 -type f | sort | head -100
          cat public/javadoc/index.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public
          destination_dir: .
          keep_files: true