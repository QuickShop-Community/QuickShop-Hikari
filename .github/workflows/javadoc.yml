name: Deploy Javadocs

on:
  push:
    branches:
      - hikari
  workflow_dispatch:

permissions:
  contents: write

jobs:
  javadocs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Generate aggregate Javadocs
        run: mvn -B clean javadoc:aggregate -P github --file pom.xml

      - name: Prepare Javadocs
        run: |
          rm -rf ./public
          mkdir -p ./public/javadoc
          cp -R target/reports/apidocs/* ./public/javadoc/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          destination_dir: .
          keep_files: true