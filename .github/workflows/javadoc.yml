name: Deploy Javadocs

on:
  workflow_dispatch:
  push:
    branches:
      - hikari

permissions:
  contents: write

jobs:
  javadocs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Generate aggregate Javadocs
        run: |
          mvn -B clean package javadoc:aggregate \
            -P github \
            -DskipTests \
            -Dmaven.javadoc.failOnError=false \
            -Dmaven.javadoc.failOnWarnings=false \
            --file pom.xml

      - name: Verify Javadocs generated
        run: |
          test -d target/reports/apidocs
          test -f target/reports/apidocs/index.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/reports/apidocs
          destination_dir: javadoc
          keep_files: true