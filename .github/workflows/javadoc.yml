name: Deploy Javadocs

on:
  workflow_dispatch:
  push:
    branches:
      - hikari

permissions:
  contents: write

jobs:
  javadocs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate Javadocs
        run: ./gradlew :quickshop-api:javadoc

      - name: Collect Javadocs
        run: |
          rm -rf public
          mkdir -p public/javadoc

          cp -R quickshop-api/build/docs/javadoc/* public/javadoc/

          test -f public/javadoc/index.html

          echo "Generated Javadocs:"
          find public/javadoc -maxdepth 3 -type f | sort | head -100

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: public
          destination_dir: .
          keep_files: true