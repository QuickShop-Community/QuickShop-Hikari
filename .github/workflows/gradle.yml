name: Gradle CI

on:
  push:
    branches:
      - hikari
      - cleanup
  pull_request:
    branches:
      - hikari
      - cleanup

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build -x :compatibility:itemsadder:compileJava -x :compatibility:itemsadder:shadowJar -x :compatibility:itemsadder:jar

      - name: Collect PR artifacts
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          rm -rf pr-artifacts
          mkdir -p pr-artifacts

          find quickshop-bukkit/build/libs -type f -name "QuickShop-Hikari-*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -exec cp {} pr-artifacts/ \;

          find . -type f -path "*/build/libs/Compat*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -exec cp {} pr-artifacts/ \;

          find . -type f -path "*/build/libs/Addon*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -exec cp {} pr-artifacts/ \;

          ls -la pr-artifacts

      - name: Upload PR artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: quickshop-pr-${{ github.event.pull_request.number }}
          path: pr-artifacts/*.jar
          retention-days: 14

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: success() && github.event_name != 'pull_request'
        with:
          name: quickshop-ci-artifacts
          path: |
            quickshop-bukkit/build/libs/QuickShop-Hikari-*.jar
            **/build/libs/Compat*.jar
            **/build/libs/Addon*.jar