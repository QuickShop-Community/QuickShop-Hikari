name: Snapshot Release

on:
  push:
    tags:
      - 'snapshot/*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Generate snapshot info
        id: snapshot
        shell: bash
        run: |
          MAVEN_VERSION=$(mvn help:evaluate \
            -Dexpression=project.version \
            -q \
            -DforceStdout)

          RAW_TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${RAW_TAG#snapshot/}"
          DATE=$(date -u +'%Y%m%d')
          SHORT_SHA=$(git rev-parse --short HEAD)

          RELEASE_VERSION="${TAG_VERSION}-snapshot.${DATE}+${SHORT_SHA}"

          echo "maven_version=$MAVEN_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREVIOUS_TAG=$(git tag --sort=-creatordate | grep '^snapshot/' | grep -v "^${CURRENT_TAG}$" | head -n 1 || true)

          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)")
          else
            CHANGELOG=$(git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"- %s (%h)")
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No changes found."
          fi

          {
            echo "content<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build snapshot
        run: mvn -B clean package -T 1.5C -P github --file pom.xml

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: QuickShop-Hikari ${{ steps.snapshot.outputs.release_version }}
          prerelease: true
          draft: false
          body: |
            Snapshot build for QuickShop-Hikari.

            Maven version: `${{ steps.snapshot.outputs.maven_version }}`
            Snapshot version: `${{ steps.snapshot.outputs.release_version }}`
            Source tag: `${{ github.ref_name }}`
            Commit: `${{ github.sha }}`
            Java: `21`

            ## Changes

            ${{ steps.changelog.outputs.content }}
          files: |
            quickshop-bukkit/target/QuickShop-Hikari-*.jar
            **/target/Compat*.jar
            **/target/Addon*.jar