name: Publish Hangar

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build release artifacts
        run: mvn -B clean package -T 1.5C --file pom.xml

      - name: Publish to Hangar
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          hangar-id: QuickShop-Hikari
          hangar-token: ${{ secrets.HANGAR_TOKEN }}

          files: |
            quickshop-bukkit/target/QuickShop-Hikari-*.jar

          loaders: |
            folia
            paper
            purpur

          game-versions: |
            >=1.20 <=26.2

          game-version-filter: releases

          java: |
            21

          version-type: release