name: Snapshot Release

on:
  workflow_dispatch:
    inputs:
      snapshot_tag:
        description: "Snapshot tag/version, example: snapshot/6.3.0.0-8"
        required: true
        type: string

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Generate snapshot info
        id: snapshot
        shell: bash
        run: |
          MAVEN_VERSION=$(mvn help:evaluate \
            -Dexpression=project.version \
            -q \
            -DforceStdout)

          RAW_TAG="${{ inputs.snapshot_tag }}"
          TAG_VERSION="${RAW_TAG#snapshot/}"
          DATE=$(date -u +'%Y%m%d')
          SHORT_SHA=$(git rev-parse --short HEAD)

          RELEASE_VERSION="${TAG_VERSION}-snapshot.${DATE}+${SHORT_SHA}"

          echo "raw_tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "maven_version=$MAVEN_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          PREVIOUS_TAG=$(git tag --sort=-creatordate | grep '^snapshot/' | head -n 1 || true)

          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log -n 25 --pretty=format:"- %s (%h)")
            CHANGELOG="${CHANGELOG}

          _No previous snapshot tag found. Showing latest 25 commits only._"
          else
            CHANGELOG=$(git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"- %s (%h)" | head -n 25)
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No changes found."
          fi

          {
            echo "content<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build snapshot
        run: mvn -B clean package -T 1.5C -P github --file pom.xml

      - name: Collect release artifacts
        shell: bash
        run: |
          rm -rf release-artifacts
          mkdir -p release-artifacts

          find quickshop-bukkit/target -type f -name "QuickShop-Hikari-*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -exec cp {} release-artifacts/ \;

          find . -type f -path "*/target/Compat*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -exec cp {} release-artifacts/ \;

          find . -type f -path "*/target/Addon*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -exec cp {} release-artifacts/ \;

          echo "Collected artifacts:"
          ls -la release-artifacts

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.snapshot.outputs.raw_tag }}
          target_commitish: ${{ github.sha }}
          name: QuickShop-Hikari ${{ steps.snapshot.outputs.release_version }}
          prerelease: true
          draft: false
          body: |
            Snapshot build for QuickShop-Hikari.

            Maven version: `${{ steps.snapshot.outputs.maven_version }}`
            Snapshot version: `${{ steps.snapshot.outputs.release_version }}`
            Source tag: `${{ steps.snapshot.outputs.raw_tag }}`
            Commit: `${{ github.sha }}`
            Java: `21`

            ## Changes

            ${{ steps.changelog.outputs.content }}
          files: |
            release-artifacts/*.jar