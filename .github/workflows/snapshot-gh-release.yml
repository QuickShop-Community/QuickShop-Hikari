name: Snapshot Release

on:
  workflow_dispatch:
    inputs:
      snapshot_tag:
        description: "Snapshot tag/version, example: snapshot/6.4.0.0-SNAPSHOT-1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate snapshot info
        id: snapshot
        shell: bash
        run: |
          MAVEN_VERSION=$(./gradlew -q printVersion)

          RAW_TAG="${{ inputs.snapshot_tag }}"
          TAG_VERSION="${RAW_TAG#snapshot/}"
          DATE=$(date -u +'%Y%m%d')
          SHORT_SHA=$(git rev-parse --short HEAD)

          RELEASE_VERSION="${TAG_VERSION}-snapshot.${DATE}+${SHORT_SHA}"

          echo "raw_tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "maven_version=$MAVEN_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          # First, look for the most recent snapshot tag reachable from HEAD.
          PREVIOUS_TAG=$(git describe \
            --tags \
            --abbrev=0 \
            --match 'snapshot/*' \
            HEAD^ 2>/dev/null || true)

          BASELINE_TYPE="snapshot"

          # If there is no previous snapshot, use the most recent normal
          # release tag reachable from HEAD.
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG=$(git describe \
              --tags \
              --abbrev=0 \
              --exclude 'snapshot/*' \
              HEAD^ 2>/dev/null || true)

            BASELINE_TYPE="release"
          fi

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous snapshot or release tag found."
            echo "Using latest 25 commits."

            CHANGELOG=$(git log \
              -n 25 \
              --pretty=format:"- %s (%h)")

            CHANGELOG="${CHANGELOG}

          _No previous snapshot or release tag was found. Showing latest 25 commits only._"
          else
            echo "Using previous ${BASELINE_TYPE} tag: ${PREVIOUS_TAG}"

            CHANGELOG=$(git log \
              -n 25 \
              "${PREVIOUS_TAG}..HEAD" \
              --pretty=format:"- %s (%h)")
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No changes found."
          fi

          {
            echo "content<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "baseline=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "baseline_type=$BASELINE_TYPE" >> "$GITHUB_OUTPUT"

      - name: Build snapshot
        run: ./gradlew build

      - name: Collect release artifacts
        shell: bash
        run: |
          rm -rf release-artifacts
          mkdir -p release-artifacts

          find quickshop-bukkit/build/libs -type f -name "QuickShop-Hikari-*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -exec cp {} release-artifacts/ \;

          find . -type f -path "*/build/libs/Compat*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -exec cp {} release-artifacts/ \;

          find . -type f -path "*/build/libs/Addon*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -exec cp {} release-artifacts/ \;

          echo "Collected artifacts:"
          ls -la release-artifacts

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.snapshot.outputs.raw_tag }}
          target_commitish: ${{ github.sha }}
          name: QuickShop-Hikari ${{ steps.snapshot.outputs.release_version }}
          prerelease: true
          draft: false
          body: |
            Snapshot build for QuickShop-Hikari.

            **Notice: This is a development/early build use at your own risk.**
            **As always with development builds you should backup any data you have.**

            Maven version: `${{ steps.snapshot.outputs.maven_version }}`
            Snapshot version: `${{ steps.snapshot.outputs.release_version }}`
            Source tag: `${{ steps.snapshot.outputs.raw_tag }}`
            Commit: `${{ github.sha }}`
            Java: `21`

            ## Changes

            ${{ steps.changelog.outputs.content }}

          files: |
            release-artifacts/*.jar
