name: qscompat-${project.artifactId}
version: '${project.version}'
main: com.ghostchu.quickshop.compatibility.${project.artifactId}.Main
#Has to be included for folia support
folia-supported: true
api-version: '1.20'
depend:
  - IridiumSkyblock
  - QuickShop-Hikari
authors: [ creatorfromhell ]
description: Compatibility module for IridiumSkyblock
permissions:
  quickshop.iridium.override:
    description: Allows a player to bypass the IridiumSkyblock island check when admin-override is enabled.
    default: op
