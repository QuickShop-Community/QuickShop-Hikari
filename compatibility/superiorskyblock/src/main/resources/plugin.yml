name: qscompat-${project.artifactId}
version: '${project.version}'
main: com.ghostchu.quickshop.compatibility.${project.artifactId}.Main
#Has to be included for folia support
folia-supported: true
api-version: '1.20'
depend:
  - SuperiorSkyblock2
  - QuickShop-Hikari
authors: [ Ghost_chu ]
description: Compatibility module for SuperiorSkyblock
permissions:
  quickshop.superior.override:
    description: Allows a player to bypass the SuperiorSkyblock island check when admin-override is enabled.
    default: op
